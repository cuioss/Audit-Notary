# audit-notary.yaml of the unit tests: a local bare repository and an issuer that is never contacted.
repositories:
  - alias: samm-assessments
    remote: file:target/test-remotes/samm-assessments.git
    confidentiality: restricted
    retention: unlimited
rights:
  assessors:
    - repository: samm-assessments
      actions: [read, edit]
  approvers:
    - repository: samm-assessments
      actions: [read, approve]
oidc:
  issuer: https://idp.example.org/realms/audit-notary
  client-id: audit-notary-web
  client-credential-ref: file:src/test/resources/config/client-secret
web:
  origin: https://audit-notary.example.org
  session:
    idle-timeout: PT30M
    max-lifetime: PT8H
fetch:
  interval: PT1H
