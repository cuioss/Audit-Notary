<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/brand-mark.svg" />
    <title>Audit Notary</title>
    %sveltekit.head%
    <!--
      Sets the theme before the first paint, so a remembered choice never flashes the other one.
      A file of the app's own origin, not an inline script: the policy of AUN-WEB-8 admits no inline
      script besides SvelteKit's bootstrap, which it allows by hash.
    -->
    <script src="%sveltekit.assets%/theme-init.js"></script>
  </head>
  <body data-sveltekit-preload-data="off">
    <div class="app-root">%sveltekit.body%</div>
  </body>
</html>
