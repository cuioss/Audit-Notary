<!-- PROVISIONAL mascot of the README (doc/concepts/brand.adoc): drawn by hand, not AI-made, not shipped in the web app,
     replaced by the AI-made poses with recorded provenance before the first release. Palette: the mascot tokens. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-labelledby="title desc"
     stroke="#2A1A10" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <title id="title">The TrailHand ranch-hand bear (provisional drawing)</title>
  <desc id="desc">A friendly bear in a wide-brimmed hat and a gold neckerchief waves with one paw and holds a tally
    book under the other arm; the book's cover shows the TrailHand mark, and a pencil sits behind the ear.</desc>

  <!-- ears -->
  <circle cx="64" cy="82" r="17" fill="#E17512"/>
  <circle cx="64" cy="82" r="8" fill="#F6DDB0" stroke="none"/>
  <circle cx="176" cy="82" r="17" fill="#E17512"/>
  <circle cx="176" cy="82" r="8" fill="#F6DDB0" stroke="none"/>

  <!-- feet and body -->
  <ellipse cx="94" cy="284" rx="26" ry="12" fill="#E17512"/>
  <ellipse cx="146" cy="284" rx="26" ry="12" fill="#E17512"/>
  <path d="M70 190 Q60 230 72 276 H168 Q180 230 170 190 Q120 172 70 190Z" fill="#E17512"/>
  <ellipse cx="120" cy="238" rx="32" ry="36" fill="#F6DDB0" stroke="none"/>

  <!-- waving arm, left of the picture -->
  <path d="M76 198 Q46 196 40 156" fill="none" stroke-width="30"/>
  <path d="M76 198 Q46 196 40 156" fill="none" stroke="#E17512" stroke-width="22"/>
  <circle cx="40" cy="150" r="15" fill="#E17512"/>

  <!-- neckerchief -->
  <path d="M82 176 Q120 190 158 176 L120 224Z" fill="#F2B630"/>

  <!-- head, muzzle and face -->
  <circle cx="120" cy="110" r="62" fill="#E17512"/>
  <ellipse cx="120" cy="132" rx="28" ry="22" fill="#F6DDB0"/>
  <ellipse cx="120" cy="121" rx="10" ry="7" fill="#2A1A10"/>
  <path d="M106 138 Q120 150 134 138" fill="none" stroke-width="3.5"/>
  <circle cx="97" cy="104" r="6.5" fill="#2A1A10"/>
  <circle cx="143" cy="104" r="6.5" fill="#2A1A10"/>
  <circle cx="99" cy="102" r="2" fill="#F6DDB0" stroke="none"/>
  <circle cx="145" cy="102" r="2" fill="#F6DDB0" stroke="none"/>

  <!-- hat -->
  <path d="M84 62 Q82 22 120 20 Q158 22 156 62Z" fill="#A0602E"/>
  <path d="M86 45 Q120 52 154 45" fill="none" stroke="#F2B630" stroke-width="8"/>
  <ellipse cx="120" cy="64" rx="86" ry="13" fill="#A0602E"/>

  <!-- pencil behind the right ear -->
  <g transform="rotate(38 188 92)">
    <rect x="184" y="62" width="8" height="42" rx="2" fill="#F2B630" stroke-width="3"/>
    <path d="M184 104 L188 114 L192 104Z" fill="#F6DDB0" stroke-width="3"/>
    <path d="M187 111 L188 114 L189 111Z" fill="#2A1A10" stroke="none"/>
  </g>

  <!-- tally book under the arm, right of the picture -->
  <g transform="rotate(-8 184 232)">
    <rect x="150" y="192" width="70" height="78" rx="5" fill="#A0602E"/>
    <path d="M158 196 V266" fill="none" stroke-width="3"/>
    <g transform="translate(160 204) scale(2.1)" stroke-width="1.5">
      <path d="M5 2.75h9.5L19 7.25v14H5Z" fill="#F6DDB0"/>
      <path d="M14.5 2.75v4.5H19" fill="none"/>
      <path d="M9 16.5 15 10.5" fill="none" stroke-width="2.25"/>
      <circle cx="9" cy="16.5" r="2.1" fill="#A0602E" stroke-width="1.25"/>
      <circle cx="15" cy="10.5" r="2.4" fill="#F2B630" stroke-width="1.25"/>
    </g>
  </g>
  <path d="M150 190 Q162 214 152 254" fill="none" stroke-width="24"/>
  <path d="M150 190 Q162 214 152 254" fill="none" stroke="#E17512" stroke-width="16"/>
  <circle cx="152" cy="256" r="11" fill="#E17512"/>
</svg>
