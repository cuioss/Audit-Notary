# TrailHand: Quarkus runtime settings (doc/specification/configuration.adoc, application.properties). The policy of
# the application is trailhand.yaml in trailhand.config.dir.
quarkus.application.name=trailhand

# TRH-OPS-2: HTTPS on 8443, plain HTTP only redirects; management (health, metrics) on 9000.
quarkus.http.port=8080
quarkus.http.ssl-port=8443
quarkus.http.insecure-requests=redirect
quarkus.http.ssl.certificate.files=/run/secrets/tls/tls.crt
quarkus.http.ssl.certificate.key-files=/run/secrets/tls/tls.key
# Fixed at build time (the native image needs it there): health and metrics on their own port.
quarkus.management.enabled=true
quarkus.management.port=9000
quarkus.management.host=0.0.0.0

trailhand.config.dir=config
trailhand.data.dir=/app/data


# TRH-OPS-1: native image, built with Mandrel in a container.
quarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
# Classes with Random or SecureRandom instances in static fields are initialised at run time: a value created during
# the image build would be the same in every process. JGit (HttpAuthMethod$Digest, FileUtils, ...), Token Sheriff's
# flow package (PkceChallenge, FlowContext; as in API Sheriff) and the session ids of SessionStore. A package name is a
# prefix over its classes; every entry needs its own flag.
quarkus.native.additional-build-args=--enable-url-protocols=https\\,http,\
  --initialize-at-run-time=org.eclipse.jgit,\
  --initialize-at-run-time=de.cuioss.sheriff.token.client.flow,\
  --initialize-at-run-time=de.cuioss.trailhand.security.SessionStore
quarkus.native.resources.includes=META-INF/trailhand/**
# JGit in the native image (TRH-NFR-5): META-INF/native-image/de.cuioss/trailhand registers the message bundle
# JGitText (its public fields are filled by reflection) and every enum of the JGit JAR, whose values Config.getEnum
# reads by reflection; the enum list is the one of org.eclipse.jgit 7.8.0 and is regenerated with a JGit update.

# Development and tests run without TLS material and without the container paths.
%dev.quarkus.http.ssl.certificate.files=
%dev.quarkus.http.ssl.certificate.key-files=
%dev.quarkus.http.insecure-requests=enabled
%dev.trailhand.data.dir=target/data
%test.quarkus.http.ssl.certificate.files=
%test.quarkus.http.ssl.certificate.key-files=
%test.quarkus.http.insecure-requests=enabled
%test.trailhand.data.dir=target/test-data
%test.trailhand.config.dir=src/test/resources/config
# quarkus-jacoco: the agent of jacoco:prepare-agent writes target/jacoco.exec and jacoco:report builds the report
# Sonar reads; the extension's second report is off (as in API Sheriff).
%test.quarkus.jacoco.report=false
